# Default values for sgi-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global values (overridden by parent chart when used as subchart)
global:
  image:
    pullPolicy: ""
    tag: ""

replicaCount: 1

image:
  # image.repository is required
  repository: null
  # Leave empty to use parent chart's global.image.pullPolicy. Defaults to IfNotPresent if neither is set.
  pullPolicy: null
  # Leave empty to use parent chart's global.image.tag if available. Either image.tag or global.image.tag must be specified.
  tag: null

database:
  # wether to create a database to have side by side with container
  # in the same pod (sidecar)
  use_sidecar: false

server:
  port: 8080

spring:
  securityOauth2ResourceserverJwtJwkSetUri: http://sgi-sgi-keycloak/auth/realms/sgi/protocol/openid-connect/certs
  securityOauth2ClientProviderKeycloackIssuerUri: http://sgi-sgi-keycloak/auth/realms/sgi
  datasourceUrl: jdbc:postgresql://sgi-postgresql:5432/db
  liquibaseContexts: dev

extraEnvVariables: {}
# Aditional Enviroment Variables

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

#by default activate rollme annotation to rollout pod with every update
annotations:
  enabled: true
  # Additional annotations to apply to the Deployment
  deploymentAnnotations: {}
  # Additional annotations to apply to the Pod
  podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  # Ingress class name to use (e.g. haproxy, nginx). Leave empty to use the cluster default
  # className: haproxy
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths: []
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Deployment update strategy. Set type (RollingUpdate/Recreate) and configure rolling update parameters
strategy: {}
# type: RollingUpdate
# rollingUpdate:
#   maxSurge: 1
#   maxUnavailable: 0


# Configuration for the startup probe
# Controls how long Kubernetes waits for the application to start
startupProbe:
  # HTTP endpoint used to check application startup
  path: /actuator/health/readiness
  # Seconds to wait before starting probes
  initialDelaySeconds: 60
  # How often to perform the probe
  periodSeconds: 10
  # Timeout for each probe request
  timeoutSeconds: 5
  # Number of failures before considering startup failed
  failureThreshold: 30

# Configuration for the readiness probe
# Determines when the application is ready to receive traffic
readinessProbe:
  # HTTP endpoint used to determine readiness
  path: /actuator/health/readiness
  # Seconds to wait before starting probes
  initialDelaySeconds: 5
  # How often to perform the probe
  periodSeconds: 10
  # Timeout for each probe request
  timeoutSeconds: 5
  # Number of failures before marking the pod as not ready
  failureThreshold: 6

# Configuration for the liveness probe
# Determines if the application is still running and should be restarted if needed
livenessProbe:
  # HTTP endpoint used to check application health
  path: /actuator/health/liveness
  # Seconds to wait before starting probes
  initialDelaySeconds: 15
  # How often to perform the probe
  periodSeconds: 20
  # Timeout for each probe request
  timeoutSeconds: 5
  # Number of failures before restarting the container
  failureThreshold: 3
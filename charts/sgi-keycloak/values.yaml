# Default values for sgi-keycloak.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: null
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

settings:
  keycloakUser: "admin"
  keycloakPassword: "password"
  proxyAddressForwarding: "true"
  keycloakMigrationStrategy: "OVERWRITE_EXISTING"

extraEnvVariables: {}
# Aditional Enviroment Variables

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

#by default activate rollme annotation to rollout pod with every update
annotations:
  enabled: true
  # Additional annotations to apply to the Deployment
  deploymentAnnotations: {}
  # Additional annotations to apply to the Pod
  podAnnotations: {}

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  # Ingress class name to use (e.g. haproxy, nginx). Leave empty to use the cluster default
  # className: haproxy
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths: []
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Deployment update strategy. Set type (RollingUpdate/Recreate) and configure rolling update parameters
strategy: {}
# type: RollingUpdate
# rollingUpdate:
#   maxSurge: 1
#   maxUnavailable: 0

# Realm source configuration
realmConfigMap:
  # Mount a ConfigMap with custom realm configuration (true) or use base realm from Docker image (false)
  #
  # Example to create an external ConfigMap:
  #   kubectl create configmap my-custom-sgi-realm \
  #     --from-file=sgi-realm.json=./my-sgi-realm.json \
  #     -n <namespace>
  enabled: false
  
  # Name of the ConfigMap containing the sgi-realm.json file
  #
  # Example to create an external ConfigMap:
  #   kubectl create configmap my-custom-sgi-realm \
  #     --from-file=sgi-realm.json=./my-sgi-realm.json \
  #     -n <namespace>
  #
  # name: "my-custom-sgi-realm"
  name: ""

  # ConfigMap key that contains the realm JSON
  key: "sgi-realm.json"